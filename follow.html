<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PR0CESS_LIVE // FOLLOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:transparent;overflow:hidden}
body{font-family:'JetBrains Mono',ui-monospace,monospace;
  display:flex;align-items:flex-start;justify-content:flex-start}
:root{--void:#050506;--line:#1E1E22;--text:#FFFFFF;--dim:#8C8C92;--electric:#3FC6FF;}

#card{
  transform-origin:top left;
  background:rgba(5,5,6,.90);
  border:1px solid var(--line);
  border-left:3px solid var(--electric);
  border-radius:4px;
  padding:16px 20px 15px;
  width:420px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);
}
.top{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.arrow{color:var(--electric);font-size:22px;font-weight:800;line-height:1;
  animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:1}
  50%{transform:translateX(5px);opacity:.55}}
.follow{font-size:23px;font-weight:800;letter-spacing:.16em;color:#FFF;line-height:1}
.at{margin-left:auto;font-size:12px;letter-spacing:.14em;color:var(--dim)}

.sched{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:11px}
.sched .d{font-size:13.5px;font-weight:700;letter-spacing:.11em;color:#FFF}
.sched .t{font-size:13.5px;font-weight:700;letter-spacing:.11em;color:var(--electric)}
.sched .sep{color:#33333A;font-size:12px}

.rot{margin-top:12px;border-top:1px solid var(--line);padding-top:11px;
  height:19px;position:relative;overflow:hidden}
.rot span{position:absolute;left:0;top:0;width:100%;
  font-size:12.5px;letter-spacing:.09em;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translateY(9px);transition:opacity .45s ease,transform .45s ease}
.rot span.on{opacity:1;transform:translateY(0)}
.rot b{color:#FFF;font-weight:700}
.rot i{color:var(--electric);font-style:normal;font-weight:700}

#card.bare{background:none;border:none;box-shadow:none;padding:0}
</style>
</head>
<body>
<div id="card">
  <div class="top">
    <span class="arrow">&#10148;</span>
    <span class="follow" id="cta">FOLLOW</span>
    <span class="at" id="handle">GREXBEATZ</span>
  </div>
  <div class="sched" id="sched"></div>
  <div class="rot" id="rot"></div>
</div>

<script>
(function(){
"use strict";
var q=new URLSearchParams(location.search);

/* ---------- defaults ---------- */
var SCHED = q.get("sched") || "MON & WED|5PM;TUE|4PM;|ET";
var CTA   = q.get("cta")   || "FOLLOW";
var WHO   = q.get("who")   || "GREXBEATZ";
var SPEED = parseInt(q.get("speed"),10) || 7;      // seconds per line
var SCALE = parseFloat(q.get("scale")) || 1;
var WIDTH = parseInt(q.get("w"),10) || 420;

var MSGS = (q.get("msgs")||[
  "BEAT BATTLE EVERY WEDNESDAY — *OPEN TO ANYONE*",
  "BEAT BATTLE LEAGUE SEASON 1 — *STANDINGS LIVE*",
  "G-REX — *GREXOFFICIAL.COM*",
  "JOIN THE DISCORD [!DISCORD]",
  "CHECK OUT THE HUB [!PROCESSHUB]"
].join(";")).split(";").filter(function(s){return s.trim();});

var card=document.getElementById("card");
card.style.width=WIDTH+"px";
card.style.transform="scale("+SCALE+")";
if(q.get("bare")==="1") card.className="bare";
document.getElementById("cta").textContent=CTA;
var h=document.getElementById("handle");
if(WHO==="off") h.style.display="none"; else h.textContent=WHO;

/* ---------- schedule ---------- */
var sw=document.getElementById("sched");
SCHED.split(";").forEach(function(part,i){
  if(!part)return;
  var bits=part.split("|");
  if(i>0){ var s=document.createElement("span"); s.className="sep"; s.textContent="\u00B7"; sw.appendChild(s); }
  if(bits[0]){ var d=document.createElement("span"); d.className="d"; d.textContent=bits[0].trim(); sw.appendChild(d); }
  if(bits[1]){ var t=document.createElement("span"); t.className="t"; t.textContent=bits[1].trim(); sw.appendChild(t); }
});

/* ---------- rotating line ---------- */
function fmt(txt){
  var out="", i=0;
  while(i<txt.length){
    var c=txt[i];
    if(c==="*"){ var e=txt.indexOf("*",i+1); if(e>-1){ out+="<b>"+esc(txt.slice(i+1,e))+"</b>"; i=e+1; continue; } }
    if(c==="["){ var e2=txt.indexOf("]",i+1); if(e2>-1){ out+="<i>"+esc(txt.slice(i+1,e2))+"</i>"; i=e2+1; continue; } }
    out+=esc(c); i++;
  }
  return out;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var rot=document.getElementById("rot"), at=0, cur=null;
function step(){
  if(!MSGS.length)return;
  var next=document.createElement("span");
  next.innerHTML=fmt(MSGS[at].trim());
  rot.appendChild(next);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ next.className="on"; }); });
  if(cur){
    var old=cur;
    old.className="";
    setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); },600);
  }
  cur=next;
  at=(at+1)%MSGS.length;
}
step();
setInterval(step, SPEED*1000);
})();
</script>
</body>
</html>
