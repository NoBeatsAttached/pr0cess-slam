<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#030303" />
<title>PR0CESS_LIVE // OBS CONTROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--void:#030303;--panel:#0B0B0C;--panel2:#111113;--line:#1A1A1D;--line2:#26262A;
  --text:#EDEDED;--dim:#8A8A92;--dimmer:#4A4A52;--electric:#3FC6FF;--hot:#FF2E5F;--go:#3FFF9E;
  --hdr:56px;}
html,body{height:100%}
body{background:var(--void);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;
  font-weight:400;overscroll-behavior:none}
body.bridge{background:transparent}

/* ---------- shell ---------- */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:20;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(3,3,3,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hl{font-size:11px;letter-spacing:.24em;color:#FFF;white-space:nowrap}
.hl .z{color:var(--electric)}
.hl.big{font-size:14px;letter-spacing:.26em;margin-bottom:26px;text-align:center}
.hr{margin-left:auto;display:flex;align-items:center;gap:9px}
.statxt{font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
  max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dimmer);flex:none}
.dot.live{background:var(--go);box-shadow:0 0 0 0 rgba(63,255,158,.6);animation:pulse 2.4s infinite}
.dot.dead{background:var(--hot)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(63,255,158,0)}100%{box-shadow:0 0 0 0 rgba(63,255,158,0)}}
.ubtn{position:relative;background:transparent;border:1px solid var(--line2);color:var(--dimmer);
  font:inherit;font-size:15px;line-height:1;padding:8px 11px;cursor:pointer;transition:.15s}
.ubtn.armed{border-color:var(--electric);color:var(--electric)}
.ubtn:disabled{opacity:.4;cursor:default}
.ubtn sup{font-size:8px;letter-spacing:0;margin-left:2px}

.view{padding:calc(var(--hdr) + 22px) 18px 60px;max-width:1080px;margin:0 auto}

.grid{display:grid;grid-template-columns:1fr;gap:30px;align-items:start}
@media(min-width:780px){.grid{grid-template-columns:1.4fr 1fr;gap:26px}}
.grid2{display:grid;grid-template-columns:1fr;gap:26px;margin-top:34px;
  border-top:1px solid var(--line);padding-top:26px}
@media(min-width:780px){.grid2{grid-template-columns:1fr 1fr}}
.sec{min-width:0}
.sec+.sec{margin-top:26px}

/* ---------- bits ---------- */
.lab{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dimmer);margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--panel);border:1px solid var(--line2);color:var(--dim);font:inherit;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:10px 13px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip[aria-pressed="true"]{border-color:var(--electric);color:var(--electric);background:rgba(63,198,255,.09)}
.chip.live{border-color:var(--go);color:var(--go);background:rgba(63,255,158,.08)}
.hint{font-size:9px;letter-spacing:.1em;color:var(--dimmer);text-transform:uppercase;
  margin-top:10px;text-align:center;line-height:1.8}
.note{font-size:9.5px;letter-spacing:.1em;color:var(--dimmer);text-transform:uppercase;
  margin-top:14px;line-height:1.8}
.blank{border:1px dashed var(--line2);padding:20px 16px;text-align:center;font-size:10px;
  letter-spacing:.1em;color:var(--dimmer);line-height:1.8}
.footlinks{display:flex;justify-content:center;gap:22px;margin-top:26px;
  border-top:1px solid var(--line);padding-top:16px}
.footlinks a{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dimmer);text-decoration:none}
.footlinks a:hover{color:var(--electric)}

/* ---------- map ---------- */
.map{position:relative;border:1px solid var(--line2);aspect-ratio:16/9;overflow:hidden;
  touch-action:none;user-select:none;
  background:linear-gradient(rgba(63,198,255,.045) 1px,transparent 1px) 0 0/100% 25%,
    linear-gradient(90deg,rgba(63,198,255,.045) 1px,transparent 1px) 0 0/25% 100%,#070709}
.mapempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;letter-spacing:.18em;color:var(--dimmer);text-transform:uppercase}
.mi{position:absolute;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.045);
  overflow:hidden;cursor:grab}
.mi span{display:block;font-size:8px;letter-spacing:.08em;color:var(--dim);padding:3px 4px;
  white-space:nowrap;text-transform:uppercase;pointer-events:none}
.mi.sel{border-color:var(--electric);background:rgba(63,198,255,.13);z-index:5;overflow:visible;cursor:grabbing}
.mi.sel span{color:var(--electric)}
.mi.off{opacity:.3;border-style:dashed}
.mi.stray{border-color:var(--hot);border-style:dotted;background:rgba(255,46,95,.1)}
.mi.stray span{color:var(--hot)}
.mi .hd{position:absolute;background:var(--electric);border:1px solid #000;z-index:8}
.hd.nw,.hd.ne,.hd.sw,.hd.se{width:14px;height:14px}
.hd.n,.hd.s{left:50%;margin-left:-11px;width:22px;height:11px}
.hd.e,.hd.w{top:50%;margin-top:-11px;height:22px;width:11px}
.hd.nw{left:-7px;top:-7px;cursor:nwse-resize}
.hd.ne{right:-7px;top:-7px;cursor:nesw-resize}
.hd.sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.hd.se{right:-7px;bottom:-7px;cursor:nwse-resize}
.hd.n{top:-6px;cursor:ns-resize}
.hd.s{bottom:-6px;cursor:ns-resize}
.hd.w{left:-6px;cursor:ew-resize}
.hd.e{right:-6px;cursor:ew-resize}

/* ---------- source list ---------- */
.srclist{border:1px solid var(--line)}
.src{display:flex;align-items:center;gap:10px;padding:13px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.src:last-child{border-bottom:none}
.src.sel{background:rgba(63,198,255,.06);box-shadow:inset 2px 0 0 var(--electric)}
.src .nm{flex:1;font-size:12px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src.off .nm{color:var(--dimmer);text-decoration:line-through}
.eye{background:transparent;border:1px solid var(--line2);color:var(--dimmer);font:inherit;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;cursor:pointer;flex:none}
.eye.on{border-color:var(--go);color:var(--go)}

/* ---------- pads ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;margin:0 auto}
.pad button{background:var(--panel);border:1px solid var(--line2);color:var(--text);font:inherit;
  font-size:16px;padding:18px 0;cursor:pointer;transition:.12s}
.pad button:hover{border-color:var(--electric);color:var(--electric)}
.pad .blank2{visibility:hidden}
.pad .ctr{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.two{display:flex;gap:6px;margin-top:6px}
.two button{flex:1;background:var(--panel);border:1px solid var(--line2);color:var(--text);font:inherit;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:14px 0;cursor:pointer;transition:.12s}
.two button:hover{border-color:var(--electric);color:var(--electric)}

/* ---------- inputs ---------- */
.tin{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--text);font:inherit;
  font-size:13px;padding:13px;margin-bottom:8px}
.tin:focus{outline:none;border-color:var(--electric)}
.btn{width:100%;background:var(--electric);color:#000;border:none;font:inherit;font-weight:700;
  font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;padding:15px;cursor:pointer;
  transition:.15s;margin-top:6px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim);font-weight:400}
.btn.ghost:hover{border-color:var(--electric);color:var(--electric);filter:none}
.btn.danger{background:var(--hot);color:#000;border:none;font-weight:700}
#rawout{width:100%;min-height:120px;margin-top:10px;background:var(--void);border:1px solid var(--line2);
  color:var(--electric);font:inherit;font-size:10px;padding:10px;resize:vertical}

/* ---------- gate ---------- */
.gate{max-width:290px;margin:0 auto;padding:18vh 20px 0}
.gate .tin{text-align:center;font-size:16px;letter-spacing:.3em}
.gate .note{text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function rawPw(){

/* ---------- tiny SHA-256 (works with or without crypto.subtle) ---------- */
var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,

0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256bytes(msg){
  function rr(n,x){return (x>>>n)|(x<<(32-n));}
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes=[],i;
  for(i=0;i<msg.length;i++){
    var c=msg.charCodeAt(i);
    if(c<128) bytes.push(c);
    else if(c<2048){ bytes.push(192|(c>>6),128|(c&63)); }
    else { bytes.push(224|(c>>12),128|((c>>6)&63),128|(c&63)); }
  }
  var bitLen=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56) bytes.push(0);
  for(i=7;i>=0;i--) bytes.push((bitLen/Math.pow(2,i*8))&255);
  var w=new Array(64);
  for(var b=0;b<bytes.length;b+=64){
    for(i=0;i<16;i++) w[i]=(bytes[b+i*4]<<24)|(bytes[b+i*4+1]<<16)|(bytes[b+i*4+2]<<8)|bytes[b+i*4+3];
    for(i=16;i<64;i++){
      var s0=rr(7,w[i-15])^rr(18,w[i-15])^(w[i-15]>>>3);
      var s1=rr(17,w[i-2])^rr(19,w[i-2])^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    var a=H[0],bb=H[1],c2=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var S1=rr(6,e)^rr(11,e)^rr(25,e);
      var ch=(e&f)^((~e)&g);
      var t1=(h+S1+ch+K[i]+w[i])|0;
      var S0=rr(2,a)^rr(13,a)^rr(22,a);
      var mj=(a&bb)^(a&c2)^(bb&c2);

      h=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=bb;bb=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c2)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;

  var out=[];
  for(i=0;i<8;i++){ out.push((H[i]>>>24)&255,(H[i]>>>16)&255,(H[i]>>>8)&255,H[i]&255); }
  return out;
}
function b64(bytes){
  var s=""; for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s);
}
function sha256b64(str){ return b64(sha256bytes(str)); }

/* ==========================================================
   BRIDGE — runs on G-REX's machine
   ========================================================== */
function runBridge(){
  document.body.className="bridge";
  var pw=rawPw();
  var ws=null, obsReady=false, reqId=0, pending={}, canvas={w:1920,h:1080};
  var curScene="", deckHere=false, lastErr="", textKind="", kinds=[];
  var undoStack=[];
  function pushUndo(label,fn){
    undoStack.push({label:label,fn:fn});
    if(undoStack.length>25) undoStack.shift();
    send("undo",{n:undoStack.length,last:label});
  }
  function pickKind(prefix){
    for(var i=0;i<kinds.length;i++) if(kinds[i].indexOf(prefix)===0) return kinds[i];
    return "";
  }

  app.innerHTML='<div class="bwrap"><div class="bcard"><h1>PR<span class="z">0</span>CESS_LIVE // BRIDGE</h1>'+
    '<div class="brow"><span class="k">OBS</span><span class="v" id="b_obs">connecting</span></div>'+
    '<div class="brow"><span class="k">Relay</span><span class="v" id="b_rel">connecting</span></div>'+
    '<div class="brow"><span class="k">Last</span><span class="v" id="b_last">\u2014</span></div>'+
    '<div class="brow"><span class="k">View</span><span class="v" id="b_shot">\u2014</span></div>'+
    '<p class="hint" style="margin-top:14px">Leave this running. It takes commands from the deck and passes them to OBS.</p>'+
    '</div></div>';
  function setRow(id,txt,cls){ var e=document.getElementById(id); if(e){ e.textContent=txt; e.className="v"+(cls?" "+cls:""); } }

  function obsConnect(){
    setRow("b_obs","connecting");
    try{ ws=new WebSocket("ws://127.0.0.1:"+OBS_PORT); }
    catch(e){ setRow("b_obs","blocked","bad"); return; }

    ws.onopen=function(){ setRow("b_obs","handshaking"); };
    ws.onclose=function(e){
      obsReady=false;
      var why="disconnected";
      if(e&&e.code===4009) why="WRONG PASSWORD";
      else if(e&&e.code===4008) why="handshake timed out";
      else if(e&&e.code===1006) why="OBS not listening \u2014 is the server enabled?";
      setRow("b_obs",why,"bad");
      setTimeout(obsConnect,4000);
    };
    ws.onerror=function(){ setRow("b_obs","can\u2019t reach OBS","bad"); };
    ws.onmessage=function(ev){
      var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(m.op===0){
        var ident={op:1,d:{rpcVersion:1}};
        if(m.d.authentication){
          var secret=sha256b64(pw+m.d.authentication.salt);
          ident.d.authentication=sha256b64(secret+m.d.authentication.challenge);
        }
        ws.send(JSON.stringify(ident));
      }
      if(m.op===2){
        obsReady=true; setRow("b_obs","connected","ok");
        obs("GetVideoSettings",{}).then(function(v){
          if(v){ canvas.w=v.baseWidth||1920; canvas.h=v.baseHeight||1080; }
        });
        obs("GetInputKindList",{}).then(function(r){
          kinds=((r&&r.inputKinds)||[]);
          textKind=kinds.filter(function(k){ return k.indexOf("text_")===0; }).sort().pop()||"";
        });
        pushState();
      }
      if(m.op===7){
        var p=pending[m.d.requestId];
        if(p){ delete pending[m.d.requestId];
          if(m.d.requestStatus&&m.d.requestStatus.result) p.res(m.d.responseData||{});
          else {
            lastErr=(m.d.requestStatus&&(m.d.requestStatus.comment||m.d.requestStatus.code))||"failed";
            p.res(null);
          } }
      }
      if(m.op===5){ // something changed in OBS — refresh the deck
        if(/Scene|SceneItem|Input/.test(m.d.eventType||"")) schedulePush();
      }
    };
  }

  function obs(type,data){
    return new Promise(function(res){
      if(!ws||ws.readyState!==1||!obsReady){ res(null); return; }
      var id="r"+(++reqId);
      pending[id]={res:res};
      ws.send(JSON.stringify({op:6,d:{requestType:type,requestId:id,requestData:data||{}}}));
      setTimeout(function(){ if(pending[id]){ delete pending[id]; res(null); } },4000);
    });
  }

  var pushTimer=null;
  function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(pushState,250); }

  function pushState(){
    if(!obsReady){ send("state",{ok:false}); return; }
    obs("GetSceneList",{}).then(function(sl){
      if(!sl){ send("state",{ok:false}); return; }
      var cur=sl.currentProgramSceneName;
      curScene=cur;
      var scenes=(sl.scenes||[]).map(function(s){return s.sceneName;}).reverse();
      obs("GetSceneItemList",{sceneName:cur}).then(function(il){
        var raw=((il&&il.sceneItems)||[]).slice().reverse();
        if(!raw.length){ send("state",{ok:true,scenes:scenes,current:cur,items:[],cw:canvas.w,ch:canvas.h}); return; }
        var jobs=raw.map(function(it){
          return obs("GetSceneItemTransform",{sceneName:cur,sceneItemId:it.sceneItemId})
          .then(function(tr){
            var t=(tr&&tr.sceneItemTransform)||it.sceneItemTransform||{};
            var bt=t.boundsType||"OBS_BOUNDS_NONE";
            var w,h;
            if(bt!=="OBS_BOUNDS_NONE"&&t.boundsWidth){
              w=t.boundsWidth; h=t.boundsHeight;
            }else{
              var sw=(t.sourceWidth||0)-(t.cropLeft||0)-(t.cropRight||0);
              var sh=(t.sourceHeight||0)-(t.cropTop||0)-(t.cropBottom||0);
              w=sw*(t.scaleX||1); h=sh*(t.scaleY||1);
              if((!w||!h)&&t.width){ w=t.width; h=t.height; }
            }
            if(!w||w<1) w=canvas.w*0.08;
            if(!h||h<1) h=canvas.h*0.08;
            var a=(typeof t.alignment==="number")?t.alignment:5;
            var x=t.positionX||0, y=t.positionY||0;
            if(a&2) x=x-w; else if(!(a&1)) x=x-w/2;
            if(a&8) y=y-h; else if(!(a&4)) y=y-h/2;
            return {id:it.sceneItemId,name:it.sourceName,on:it.sceneItemEnabled!==false,
                    x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)};
          });
        });
        Promise.all(jobs).then(function(items){
          send("state",{ok:true,scenes:scenes,current:cur,items:items,cw:canvas.w,ch:canvas.h});
        });
      });
    });
  }

  function note(t){ setRow("b_last",t); }

  function handle(p){
    if(!p||!p.cmd)return;
    note(p.cmd);
    if(p.cmd==="ping"){ pushState(); return; }
    if(p.cmd==="raw"){
      obs("GetSceneItemList",{sceneName:p.scene}).then(function(il){
        var raw=((il&&il.sceneItems)||[]);
        Promise.all(raw.map(function(it){
          return obs("GetSceneItemTransform",{sceneName:p.scene,sceneItemId:it.sceneItemId})
            .then(function(r){ return {n:it.sourceName,t:(r&&r.sceneItemTransform)||null}; });
        })).then(function(all){
          send("raw",{canvas:canvas.w+"x"+canvas.h,scene:p.scene,items:all});
        });
      });
      return;
    }
    if(p.cmd==="create"){
      var nm=(p.name||"").trim()||("SOURCE "+Date.now());
      var kind="", settings={};
      if(p.kind==="browser"){
        kind=pickKind("browser_source");
        settings={url:p.val,width:p.w||1920,height:p.h||1080};
      }else if(p.kind==="media"){
        kind=pickKind("ffmpeg_source");
        settings={is_local_file:false,input:p.val,looping:true,restart_on_activate:true};
      }else if(p.kind==="text"){
        kind=textKind;
        settings={text:String(p.val||""),font:{face:"Arial",size:96,style:"Bold"}};
      }else if(p.kind==="color"){
        kind=pickKind("color_source");
        settings={width:Math.round(canvas.w/2),height:Math.round(canvas.h/2),color:4278190335};
      }
      if(!kind){ note("this OBS has no "+p.kind+" source"); return; }
      obs("CreateInput",{sceneName:p.scene,inputName:nm,inputKind:kind,
        inputSettings:settings,sceneItemEnabled:true}).then(function(r){
        if(!r){ note("create failed: "+lastErr); return; }
        note("added "+nm);
        pushUndo("add source",function(){ obs("RemoveInput",{inputName:nm}); });
        schedulePush();
      });
      return;
    }
    if(p.cmd==="del"){
      var dn=p.name, dsc=p.scene, did=p.id;
      obs("GetInputSettings",{inputName:dn}).then(function(si){
        var finish=function(savedT){
          obs("RemoveInput",{inputName:dn}).then(function(r){
            if(!r){ note("remove failed: "+lastErr); return; }
            note("removed "+dn);
            if(si&&si.inputKind){
              pushUndo("delete",function(){
                obs("CreateInput",{sceneName:dsc,inputName:dn,inputKind:si.inputKind,
                  inputSettings:si.inputSettings||{},sceneItemEnabled:true}).then(function(cr){
                  if(cr&&savedT){
                    obs("SetSceneItemTransform",{sceneName:dsc,sceneItemId:cr.sceneItemId,
                      sceneItemTransform:{positionX:savedT.positionX,positionY:savedT.positionY,
                        scaleX:savedT.scaleX,scaleY:savedT.scaleY,
                        alignment:savedT.alignment,
                        boundsType:savedT.boundsType,boundsWidth:savedT.boundsWidth,
                        boundsHeight:savedT.boundsHeight,boundsAlignment:savedT.boundsAlignment}});
                  }
                  schedulePush();
                });
              });
            }
            schedulePush();
          });
        };
        if(did) obs("GetSceneItemTransform",{sceneName:dsc,sceneItemId:did})
                  .then(function(tr){ finish(tr&&tr.sceneItemTransform); });
        else finish(null);
      });
      return;
    }
    if(p.cmd==="text"){
      if(!textKind){ note("no text source available"); return; }
      var tn="PRC_DROP_"+Date.now();
      obs("CreateInput",{sceneName:p.scene,inputName:tn,inputKind:textKind,
        inputSettings:{text:String(p.msg||""),font:{face:"Arial",size:p.size||96,style:"Bold"}},
        sceneItemEnabled:true}).then(function(r){
        if(!r){ note("text failed: "+lastErr); return; }
        obs("SetSceneItemTransform",{sceneName:p.scene,sceneItemId:r.sceneItemId,
          sceneItemTransform:{alignment:0,positionX:canvas.w/2,positionY:canvas.h/2}});
        if(p.secs) setTimeout(function(){ obs("RemoveInput",{inputName:tn}).then(schedulePush); },p.secs*1000);
        schedulePush();
      });
      return;
    }
    if(p.cmd==="media"){
      var mn="PRC_DROP_"+Date.now();
      obs("CreateInput",{sceneName:p.scene,inputName:mn,inputKind:"ffmpeg_source",
        inputSettings:{is_local_file:false,input:String(p.url||""),looping:!!p.loop,
                       restart_on_activate:true,clear_on_media_end:true},
        sceneItemEnabled:true}).then(function(r){
        if(!r){ note("media failed: "+lastErr); return; }
        obs("SetSceneItemTransform",{sceneName:p.scene,sceneItemId:r.sceneItemId,
          sceneItemTransform:{alignment:0,positionX:canvas.w/2,positionY:canvas.h/2,
            boundsType:"OBS_BOUNDS_SCALE_INNER",boundsAlignment:0,
            boundsWidth:Math.round(canvas.w*0.6),boundsHeight:Math.round(canvas.h*0.6)}});
        if(p.secs) setTimeout(function(){ obs("RemoveInput",{inputName:mn}).then(schedulePush); },p.secs*1000);
        schedulePush();
      });
      return;
    }
    if(p.cmd==="nuke"){
      obs("GetInputList",{}).then(function(r){
        ((r&&r.inputs)||[]).forEach(function(i){
          if((i.inputName||"").indexOf("PRC_DROP_")===0) obs("RemoveInput",{inputName:i.inputName});
        });
        setTimeout(schedulePush,400);
      });
      return;
    }
    if(p.cmd==="undo"){
      var u=undoStack.pop();
      if(!u){ note("nothing to undo"); send("undo",{n:0,last:""}); return; }
      note("undid "+u.label);
      u.fn();
      send("undo",{n:undoStack.length,last:undoStack.length?undoStack[undoStack.length-1].label:""});
      setTimeout(schedulePush,300);
      return;
    }
    if(p.cmd==="scene"){
      var wasScene=curScene;
      if(wasScene&&wasScene!==p.scene){
        pushUndo("scene change",function(){ obs("SetCurrentProgramScene",{sceneName:wasScene}); });
      }
      obs("SetCurrentProgramScene",{sceneName:p.scene}).then(schedulePush);
      return;
    }
    if(p.cmd==="vis"){
      var wasOn=!p.on, vsc=p.scene, vid=p.id;
      pushUndo(p.on?"show":"hide",function(){
        obs("SetSceneItemEnabled",{sceneName:vsc,sceneItemId:vid,sceneItemEnabled:wasOn});
      });
      obs("SetSceneItemEnabled",{sceneName:p.scene,sceneItemId:p.id,sceneItemEnabled:!!p.on}).then(schedulePush);
      return;
    }
    if(p.cmd==="box"){
      obs("GetSceneItemTransform",{sceneName:p.scene,sceneItemId:p.id}).then(function(r){
        if(!r||!r.sceneItemTransform)return;
        var t=r.sceneItemTransform;
        var prevB={positionX:t.positionX,positionY:t.positionY,scaleX:t.scaleX,scaleY:t.scaleY,
                   boundsWidth:t.boundsWidth,boundsHeight:t.boundsHeight};
        var bsc=p.scene, bid=p.id, bt=t.boundsType||"OBS_BOUNDS_NONE";
        pushUndo("resize",function(){
          var back={positionX:prevB.positionX,positionY:prevB.positionY,
                    scaleX:prevB.scaleX,scaleY:prevB.scaleY};
          if(bt!=="OBS_BOUNDS_NONE"){ back.boundsWidth=prevB.boundsWidth; back.boundsHeight=prevB.boundsHeight; }
          obs("SetSceneItemTransform",{sceneName:bsc,sceneItemId:bid,sceneItemTransform:back});
        });
        var w=Math.max(8,p.w||8), h=Math.max(8,p.h||8);
        var nt={};
        if(bt!=="OBS_BOUNDS_NONE"){
          nt.boundsWidth=Math.round(w); nt.boundsHeight=Math.round(h);
        }else{
          var sw=(t.sourceWidth||0)-(t.cropLeft||0)-(t.cropRight||0);
          var sh=(t.sourceHeight||0)-(t.cropTop||0)-(t.cropBottom||0);
          if(sw>0) nt.scaleX=Math.max(.02,w/sw);
          if(sh>0) nt.scaleY=Math.max(.02,h/sh);
        }
        var a=(typeof t.alignment==="number")?t.alignment:5;
        var px=p.x, py=p.y;
        if(a&2) px=p.x+w; else if(!(a&1)) px=p.x+w/2;
        if(a&8) py=p.y+h; else if(!(a&4)) py=p.y+h/2;
        nt.positionX=Math.round(px); nt.positionY=Math.round(py);
        obs("SetSceneItemTransform",{sceneName:p.scene,sceneItemId:p.id,sceneItemTransform:nt})
          .then(schedulePush);
      });
      return;
    }
    if(p.cmd==="move"||p.cmd==="scale"||p.cmd==="snap"||p.cmd==="place"){
      obs("GetSceneItemTransform",{sceneName:p.scene,sceneItemId:p.id}).then(function(r){
        if(!r||!r.sceneItemTransform)return;
        var prev={positionX:r.sceneItemTransform.positionX,positionY:r.sceneItemTransform.positionY,
                  scaleX:r.sceneItemTransform.scaleX,scaleY:r.sceneItemTransform.scaleY};
        var psc=p.scene, pid=p.id;
        pushUndo(p.cmd==="scale"?"resize":"move",function(){
          obs("SetSceneItemTransform",{sceneName:psc,sceneItemId:pid,sceneItemTransform:prev});
        });
        var t=r.sceneItemTransform, nt={};
        if(p.cmd==="place"){
          var pw2=(t.sourceWidth||0)*t.scaleX, ph2=(t.sourceHeight||0)*t.scaleY;
          nt.positionX=Math.round(p.nx*canvas.w-pw2/2);
          nt.positionY=Math.round(p.ny*canvas.h-ph2/2);
        }
        if(p.cmd==="move"){
          nt.positionX=t.positionX+(p.dx||0);
          nt.positionY=t.positionY+(p.dy||0);
        }
        if(p.cmd==="scale"){
          var f=1+(p.dir>0?SCALE_STEP:-SCALE_STEP);
          nt.scaleX=Math.max(.05,t.scaleX*f);
          nt.scaleY=Math.max(.05,t.scaleY*f);
        }
        if(p.cmd==="snap"){
          var w=(t.sourceWidth||0)*t.scaleX, h=(t.sourceHeight||0)*t.scaleY;
          var m=24;
          var pos={
            tl:[m,m], tr:[canvas.w-w-m,m], bl:[m,canvas.h-h-m], br:[canvas.w-w-m,canvas.h-h-m],
            c:[(canvas.w-w)/2,(canvas.h-h)/2]
          }[p.where]||[0,0];
          nt.positionX=pos[0]; nt.positionY=pos[1];
        }
        obs("SetSceneItemTransform",{sceneName:p.scene,sceneItemId:p.id,sceneItemTransform:nt}).then(schedulePush);
      });
    }
  }

  function send(event,payload){
    if(channel){ try{ channel.send({type:"broadcast",event:event,payload:payload}); }catch(e){} }
  }

  function shot(){
    if(!obsReady||!curScene){ setRow("b_shot","waiting on OBS"); return; }
    lastErr="";
    obs("GetSourceScreenshot",{sourceName:curScene,imageFormat:"jpg",
      imageWidth:384,imageCompressionQuality:30}).then(function(r){
      if(r&&r.imageData){ deliver(r.imageData); return; }
      // some builds don't accept jpg — try png once
      obs("GetSourceScreenshot",{sourceName:curScene,imageFormat:"png",imageWidth:320}).then(function(r2){
        if(r2&&r2.imageData){ deliver(r2.imageData); return; }
        setRow("b_shot",lastErr||"no image back","bad");
      });
    });
  }
  function deliver(img){
    var kb=Math.round(img.length/1024);
    if(kb>200){ setRow("b_shot",kb+"kb — too big","bad"); return; }
    try{
      channel.send({type:"broadcast",event:"shot",payload:{img:img}});
      setRow("b_shot","sending "+kb+"kb","ok");
    }catch(e){ setRow("b_shot","send failed","bad"); }
  }

  channel=sb.channel(CHANNEL,{config:{broadcast:{self:false},presence:{key:"bridge"}}});
  channel.on("broadcast",{event:"cmd"},function(m){ handle(m.payload); });
  channel.on("presence",{event:"sync"},function(){
    var st=channel.presenceState(), f=false;
    Object.keys(st).forEach(function(k){ st[k].forEach(function(x){ if(x.role==="deck") f=true; }); });
    deckHere=f;
    if(f) shot();
  });
  channel.subscribe(function(st){
    if(st==="SUBSCRIBED"){ channel.track({role:"bridge",at:Date.now()}); setRow("b_rel","connected","ok"); pushState(); }
    if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){
      setRow("b_rel","reconnecting","bad");
      setTimeout(function(){ try{sb.removeChannel(channel);}catch(e){} location.reload(); },4000);
    }
  });
  obsConnect();
  setInterval(function(){ if(obsReady&&deckHere) pushState(); },3000);
  setInterval(function(){ if(obsReady&&!deckHere) pushState(); },30000);
}

var PIN=localStorage.getItem("slam_pin")||"", ROLE=localStorage.getItem("slam_role")||"";

var selId=null, bridgeUp=false, dragging=false;
var SLAM_OVERLAY="https://nobeatsattached.github.io/pr0cess-slam/#overlay";

function getRole(pin){ return sb.rpc("pq_role",{p_pin:pin}).then(function(r){return r.error?null:r.data;}); }
function cmd(p){ if(channel){ if(!p.scene) p.scene=ST.current; try{ channel.send({type:"broadcast",event:"cmd",payload:p}); }catch(e){} } }
function el(id){ return document.getElementById(id); }

function deckConnect(){
  channel=sb.channel(CHANNEL,{config:{broadcast:{self:false},presence:{key:"deck-"+Math.random().toString(36).slice(2,7)}}});
  channel.on("broadcast",{event:"state"},function(m){ ST=m.payload||ST; paint(); });
  channel.on("broadcast",{event:"undo"},function(m){
    var b=el("undo"); if(!b||!m.payload)return;
    var n=m.payload.n||0;
    b.disabled=(n===0);
    b.className="ubtn"+(n?" armed":"");
    b.title=n?("Undo "+(m.payload.last||"")+" ("+n+")"):"Nothing to undo";
    var c=el("undon"); if(c) c.textContent=n?n:"";
  });
  channel.on("broadcast",{event:"raw"},function(m){
    var box=el("rawout"); if(!box||!m.payload)return;
    box.style.display="block"; box.value=JSON.stringify(m.payload);
    box.focus(); box.select();
  });
  channel.on("presence",{event:"sync"},function(){
    var st=channel.presenceState(), f=false;
    Object.keys(st).forEach(function(k){ st[k].forEach(function(x){ if(x.role==="bridge") f=true; }); });
    bridgeUp=f; paintStatus();
  });
  channel.subscribe(function(s){
    if(s==="SUBSCRIBED"){ channel.track({role:"deck",at:Date.now()}); cmd({cmd:"ping"}); paintStatus(); }
    if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"||s==="CLOSED"){
      bridgeUp=false; paintStatus();
      setTimeout(function(){ try{sb.removeChannel(channel);}catch(e){} deckConnect(); },3000);
    }
  });
}

function paintStatus(){
  var d=el("dot"), s=el("stat"); if(!d||!s)return;
  var live=bridgeUp&&ST.ok;
  d.className="dot "+(live?"live":"dead");
  s.textContent=!bridgeUp?"bridge offline":(ST.ok?(ST.current||"connected"):"no OBS");
}

/* ---------- map dragging ---------- */
function wireMap(){
  var map=el("map"), drag=null;

  function calcBox(d,dx,dy,lock){
    var x=d.x0,y=d.y0,w=d.w0,h=d.h0,c=d.corner;
    var ar=(d.h0>0?d.w0/d.h0:1);
    var wide=(c.indexOf("e")>-1), narrow=(c.indexOf("w")>-1);
    var tall=(c.indexOf("s")>-1), shrt=(c.indexOf("n")>-1);
    if(wide) w=d.w0+dx;
    if(narrow) w=d.w0-dx;
    if(tall) h=d.h0+dy;
    if(shrt) h=d.h0-dy;
    if(lock&&(wide||narrow)&&(tall||shrt)) h=w/ar;
    if(w<8) w=8;
    if(h<8) h=8;
    if(narrow) x=d.x0+(d.w0-w);
    if(shrt) y=d.y0+(d.h0-h);
    return {x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)};
  }

  map.addEventListener("pointerdown",function(e){
    var t=e.target;
    var isHd=t.className&&(""+t.className).indexOf("hd")===0;
    var box=isHd?t.parentNode:(t.closest?t.closest(".mi"):null);
    if(!box||!box.getAttribute)return;
    var id=parseInt(box.getAttribute("data-id"),10);
    if(!isHd){
      selId=id; paint();
      box=map.querySelector('.mi[data-id="'+id+'"]');
      if(!box)return;
    }
    drag={mode:isHd?"size":"move",corner:isHd?t.getAttribute("data-c"):null,
          id:id,el:box,r:map.getBoundingClientRect(),ox:e.clientX,oy:e.clientY,
          x0:parseFloat(box.getAttribute("data-x"))||0,y0:parseFloat(box.getAttribute("data-y"))||0,
          w0:parseFloat(box.getAttribute("data-w"))||0,h0:parseFloat(box.getAttribute("data-h"))||0};
    try{ map.setPointerCapture(e.pointerId); }catch(err){}
    dragging=true;
    e.preventDefault();
  });

  map.addEventListener("pointermove",function(e){
    if(!drag)return;
    var cw=ST.cw||1920, ch=ST.ch||1080;
    var dx=(e.clientX-drag.ox)/drag.r.width*cw;
    var dy=(e.clientY-drag.oy)/drag.r.height*ch;
    if(drag.mode==="move"){
      drag.el.style.left=((drag.x0+dx)/cw*100)+"%";
      drag.el.style.top=((drag.y0+dy)/ch*100)+"%";
    }else{
      var b=calcBox(drag,dx,dy,e.shiftKey);
      drag.el.style.left=(b.x/cw*100)+"%";
      drag.el.style.top=(b.y/ch*100)+"%";
      drag.el.style.width=(b.w/cw*100)+"%";
      drag.el.style.height=(b.h/ch*100)+"%";
      drag.last=b;
    }
  });

  function endDrag(e){
    if(!drag){ dragging=false; return; }
    var cw=ST.cw||1920, ch=ST.ch||1080;
    if(drag.mode==="move"){
      var dx=(e.clientX-drag.ox)/drag.r.width*cw;
      var dy=(e.clientY-drag.oy)/drag.r.height*ch;
      if(Math.abs(dx)>1||Math.abs(dy)>1) cmd({cmd:"move",id:drag.id,dx:Math.round(dx),dy:Math.round(dy)});
    }else if(drag.last){
      cmd({cmd:"box",id:drag.id,x:drag.last.x,y:drag.last.y,w:drag.last.w,h:drag.last.h});
    }
    drag=null; dragging=false;
    setTimeout(function(){ cmd({cmd:"ping"}); },400);
  }
  map.addEventListener("pointerup",endDrag);
  map.addEventListener("pointercancel",function(){ drag=null; dragging=false; paint(); });
}

/* ---------- build ---------- */
function wireBuild(){
  var bKind="browser";
  var kw=el("b_kind");
  var ph={browser:"URL for the page",media:"Direct .mp4 / .webm link",
          text:"What it should say",color:"(nothing needed)"};
  [["Browser","browser"],["Media","media"],["Text","text"],["Color","color"]].forEach(function(p){
    var b=document.createElement("button");
    b.className="chip"; b.textContent=p[0];
    b.setAttribute("aria-pressed",String(bKind===p[1]));
    b.onclick=function(){ bKind=p[1];
      Array.prototype.forEach.call(kw.children,function(c){c.setAttribute("aria-pressed","false");});
      b.setAttribute("aria-pressed","true");
      el("b_val").placeholder=ph[bKind];
    };
    kw.appendChild(b);
  });
  function bnote(t){
    var n=el("b_note"); if(!n)return;
    n.textContent=t;
    setTimeout(function(){ if(el("b_note")) el("b_note").textContent="Lands on whatever scene is live and stays there."; },2600);
  }
  el("b_add").onclick=function(){
    var nm=el("b_name").value.trim(), vl=el("b_val").value.trim();
    if(!nm){ bnote("Give it a name"); return; }
    if(bKind!=="color"&&!vl){ bnote("Needs a value"); return; }
    if((bKind==="browser"||bKind==="media")&&!/^https?:\/\//i.test(vl)){ bnote("Needs an http link"); return; }
    cmd({cmd:"create",kind:bKind,name:nm,val:vl});
    el("b_name").value=""; el("b_val").value=""; bnote("Added");
  };
  el("b_slam").onclick=function(){
    cmd({cmd:"create",kind:"browser",name:"SLAM OVERLAY",val:SLAM_OVERLAY});
    bnote("Slam overlay added");
  };
  var armed=false, timer=null;
  el("b_del").onclick=function(){
    var btn=this;
    if(selId===null){ bnote("Pick a source first"); return; }
    var f=null;
    ST.items.forEach(function(it){ if(it.id===selId) f=it.name; });
    if(!f){ bnote("Can\u2019t find that one"); return; }
    if(!armed){
      armed=true; btn.textContent="Tap again to delete "+f; btn.className="btn danger";
      timer=setTimeout(function(){ armed=false; btn.textContent="Delete selected source"; btn.className="btn ghost"; },5000);
      return;
    }
    clearTimeout(timer); armed=false;
    btn.textContent="Delete selected source"; btn.className="btn ghost";
    cmd({cmd:"del",name:f,id:selId});
    bnote("Deleted "+f+" \u2014 undo can put it back");
  };
}

/* ---------- drop ---------- */
function wireDrop(){
  var secs=6, sw=el("d_secs");
  [["3s",3],["6s",6],["15s",15],["stays",0]].forEach(function(p){
    var b=document.createElement("button");
    b.className="chip"; b.textContent=p[0];
    b.setAttribute("aria-pressed",String(secs===p[1]));
    b.onclick=function(){ secs=p[1];
      Array.prototype.forEach.call(sw.children,function(c){c.setAttribute("aria-pressed","false");});
      b.setAttribute("aria-pressed","true"); };
    sw.appendChild(b);
  });
  function dnote(t){
    var n=el("d_note"); if(!n)return;
    n.textContent=t;
    setTimeout(function(){ if(el("d_note")) el("d_note").textContent="Lands on whatever scene is live right now."; },2600);
  }
  el("d_send").onclick=function(){
    var v=el("d_text").value.trim();
    if(!v){ dnote("Type something first"); return; }
    cmd({cmd:"text",msg:v,secs:secs}); el("d_text").value=""; dnote("Sent");
  };
  el("d_play").onclick=function(){
    var v=el("d_url").value.trim();
    if(!/^https?:\/\//i.test(v)){ dnote("Needs a direct http link"); return; }
    cmd({cmd:"media",url:v,secs:secs}); el("d_url").value=""; dnote("Playing");
  };
  el("d_nuke").onclick=function(){ cmd({cmd:"nuke"}); dnote("Cleared"); };
}

/* ---------- painting ---------- */
function paint(){
  if(dragging) return;
  paintStatus();

  var sc=el("scenes");
  if(sc){
    sc.innerHTML="";
    ST.scenes.forEach(function(n){
      var b=document.createElement("button");
      b.className="chip"+(n===ST.current?" live":"");
      b.textContent=n;
      b.onclick=function(){ cmd({cmd:"scene",scene:n}); };
      sc.appendChild(b);
    });
  }

  var mp=el("map");
  if(mp){
    var cw=ST.cw||1920, ch=ST.ch||1080;
    mp.innerHTML="";
    if(!ST.items.length){
      var e2=document.createElement("div");
      e2.className="mapempty";
      e2.textContent=ST.ok?"nothing in this scene":"waiting for the bridge";
      mp.appendChild(e2);
    }
    ST.items.slice().reverse().forEach(function(it){
      var d=document.createElement("div");
      var stray=((it.x+it.w<0)||(it.y+it.h<0)||(it.x>cw)||(it.y>ch));
      d.className="mi"+(it.id===selId?" sel":"")+(it.on?"":" off")+(stray?" stray":"");
      d.setAttribute("data-id",it.id);
      d.setAttribute("data-x",it.x||0); d.setAttribute("data-y",it.y||0);
      d.setAttribute("data-w",it.w||0); d.setAttribute("data-h",it.h||0);
      d.style.left=((it.x||0)/cw*100)+"%";
      d.style.top=((it.y||0)/ch*100)+"%";
      d.style.width=(Math.max(it.w||0,cw*0.03)/cw*100)+"%";
      d.style.height=(Math.max(it.h||0,ch*0.03)/ch*100)+"%";
      var s=document.createElement("span"); s.textContent=it.name; d.appendChild(s);
      if(it.id===selId){
        ["nw","n","ne","e","se","s","sw","w"].forEach(function(c){
          var g=document.createElement("i");
          g.className="hd "+c; g.setAttribute("data-c",c);
          d.appendChild(g);
        });
      }
      mp.appendChild(d);
    });
  }

  var sw2=el("srcs");
  if(sw2){
    sw2.innerHTML="";
    if(!ST.items.length){
      sw2.innerHTML='<div class="blank">Nothing here. If the dot is red the bridge isn\u2019t running.</div>';
    }else{
      var list=document.createElement("div"); list.className="srclist";
      var found=false;
      ST.items.forEach(function(it){
        if(it.id===selId) found=true;
        var row=document.createElement("div");
        row.className="src"+(it.id===selId?" sel":"")+(it.on?"":" off");
        var nm=document.createElement("div"); nm.className="nm"; nm.textContent=it.name;
        var eye=document.createElement("button");
        eye.className="eye"+(it.on?" on":"");
        eye.textContent=it.on?"shown":"hidden";
        eye.onclick=function(ev){ ev.stopPropagation(); cmd({cmd:"vis",id:it.id,on:!it.on}); };
        row.appendChild(nm); row.appendChild(eye);
        row.onclick=function(){ selId=(selId===it.id?null:it.id); paint(); };
        list.appendChild(row);
      });
      if(!found) selId=null;
      sw2.appendChild(list);
    }
  }

  var mv=el("mover");
  if(mv){
    mv.innerHTML="";
    if(selId===null){ mv.innerHTML='<div class="blank">Pick a source above.</div>'; return; }
    var pad=document.createElement("div"); pad.className="pad";
    function pb(txt,fn,cls){
      var b=document.createElement("button");
      b.textContent=txt; if(cls) b.className=cls; if(fn) b.onclick=fn; return b;
    }
    pad.appendChild(pb("","","blank2"));
    pad.appendChild(pb("\u2191",function(){cmd({cmd:"move",id:selId,dy:-NUDGE});}));
    pad.appendChild(pb("","","blank2"));
    pad.appendChild(pb("\u2190",function(){cmd({cmd:"move",id:selId,dx:-NUDGE});}));
    pad.appendChild(pb("center",function(){cmd({cmd:"snap",id:selId,where:"c"});},"ctr"));
    pad.appendChild(pb("\u2192",function(){cmd({cmd:"move",id:selId,dx:NUDGE});}));
    pad.appendChild(pb("","","blank2"));
    pad.appendChild(pb("\u2193",function(){cmd({cmd:"move",id:selId,dy:NUDGE});}));
    pad.appendChild(pb("","","blank2"));
    mv.appendChild(pad);

    var sz=document.createElement("div"); sz.className="two";
    var sm=document.createElement("button"); sm.textContent="Smaller";
    sm.onclick=function(){ cmd({cmd:"scale",id:selId,dir:-1}); };
    var bg=document.createElement("button"); bg.textContent="Bigger";
    bg.onclick=function(){ cmd({cmd:"scale",id:selId,dir:1}); };
    sz.appendChild(sm); sz.appendChild(bg); mv.appendChild(sz);

    var cn=document.createElement("div"); cn.className="two";
    [["\u2196","tl"],["\u2197","tr"],["\u2199","bl"],["\u2198","br"]].forEach(function(p){
      var b=document.createElement("button"); b.textContent=p[0];
      b.onclick=function(){ cmd({cmd:"snap",id:selId,where:p[1]}); };
      cn.appendChild(b);
    });
    mv.appendChild(cn);
  }
}

/* ---------- gate ---------- */
function renderGate(){
  app.innerHTML='<div class="gate">'+
    '<div class="hl big">PR<span class="z">0</span>CESS_LIVE <span class="z">//</span> OBS</div>'+
    '<input class="tin" id="pin" type="password" placeholder="PIN">'+
    '<button class="btn" id="unlock">Unlock</button>'+
    '<div class="note" id="gerr"></div></div>';
  function go(){
    var v=el("pin").value.trim(); if(!v)return;
    el("gerr").textContent="checking\u2026";
    getRole(v).then(function(role){
      if(role==="owner"||role==="mod"){
        PIN=v;ROLE=role;
        localStorage.setItem("slam_pin",v);localStorage.setItem("slam_role",role);
        render();
      }else{ el("gerr").textContent="Wrong PIN."; el("pin").value=""; }
    }).catch(function(){ el("gerr").textContent="Can\u2019t reach the server."; });
  }
  el("unlock").onclick=go;
  el("pin").onkeydown=function(e){ if(e.key==="Enter") go(); };
}

function render(){ if(IS_BRIDGE) runBridge(); else renderDeck(); }
render();
})();
</script>
