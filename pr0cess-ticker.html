:root{
  --void:#050506; --text:#EDEDEB; --dim:#B4B9BF; --dimmer:#676C74;
  --line:#212429; --acc:#3A93D6;
  --h:58px; --fs:17px; --pad:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:100%;height:100%;overflow:hidden;
  font-family:'JetBrains Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased}

#bar{
  position:fixed;left:0;right:0;display:flex;align-items:stretch;
  height:var(--h);
  background:#050506;
  border-bottom:1px solid var(--line);
  opacity:0;transition:opacity .5s ease;
}
#bar.in{opacity:1}
body[data-pos="top"]    #bar{top:0}
body[data-pos="bottom"] #bar{bottom:0;border-bottom:none;border-top:1px solid var(--line);
  background:#050506}

/* ---- pinned left block (always readable, never scrolls) ---- */
#pin{display:flex;align-items:center;gap:var(--pad);padding:0 var(--pad);
  flex:none;position:relative;z-index:2;
  background:#050506;
  box-shadow:14px 0 18px -6px #050506;}
#pin.off{display:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;
  box-shadow:0 0 8px rgba(58,147,214,.75);animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.brand{font-family:'Code',ui-monospace,monospace;font-size:var(--fs);
  letter-spacing:.2em;color:#fff;line-height:1;white-space:nowrap}
.brand .z{color:var(--acc)}
.rule{width:1px;height:18px;background:var(--line);flex:none}
.sched{font-size:var(--fs);letter-spacing:.14em;color:var(--text);
  font-weight:700;line-height:1;white-space:nowrap}

/* ---- scrolling ticker ---- */
#tickwrap{flex:1;min-width:0;overflow:hidden;position:relative;display:flex;align-items:center}
#track{display:flex;flex:none;will-change:transform;
  animation:scroll var(--dur,55s) linear infinite}
@keyframes scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.seq{display:flex;flex:none;align-items:center}
.item{font-size:var(--fs);letter-spacing:.14em;color:var(--dim);font-weight:500;
  white-space:nowrap;padding:0 0 0 var(--pad);line-height:1}
.item b{color:var(--text);font-weight:700}
.item i{color:var(--acc);font-style:normal;font-weight:700}
.sep{color:var(--acc);opacity:.55;padding:0 0 0 var(--pad);font-weight:700;
  font-size:var(--fs);line-height:1;flex:none}
/* soft edge so text doesn't hard-clip on the right */
#tickwrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:48px;
  background:linear-gradient(90deg,rgba(5,5,6,0),#050506);pointer-events:none}
</style>
</head>
<body>
<div id="bar">
  <div id="pin">
    <div class="dot"></div>
    <div class="brand">PR<span class="z">0</span>CESS_LIVE</div>
  </div>
  <div id="tickwrap"><div id="track"></div></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search), b = document.body;
  b.dataset.pos = (q.get('pos')||'top').toLowerCase();

  var s = parseFloat(q.get('scale')||'1');
  if(s && s!==1){
    b.style.setProperty('--h',(58*s)+'px');
    b.style.setProperty('--fs',(17*s)+'px');
    b.style.setProperty('--pad',(20*s)+'px');
  }

  var schedTxt = q.get('sched') || 'MON & WED 5PM \u00b7 TUE 4PM \u00b7 ET';
  // logo stays pinned; ?pinned=0 removes it entirely
  if(q.get('pinned') === '0') document.getElementById('pin').classList.add('off');

  var msgs = q.get('msgs')
    ? decodeURIComponent(q.get('msgs')).split('|')
    : [
        'FOLLOW <i>\u2192</i> <b>MON & WED 5PM \u00b7 TUE 4PM ET</b>',
        'BEAT BATTLE EVERY WEDNESDAY \u2014 <b>OPEN TO ANYONE</b>',
        '<b>MON & WED 5PM \u00b7 TUE 4PM \u00b7 ET</b>',
        'BEAT BATTLE LEAGUE SEASON 1 \u2014 <b>STANDINGS LIVE</b>',
        'G-REX \u2014 <b>GREXOFFICIAL.COM</b>',
        'JOIN THE DISCORD <i>!DISCORD</i>',
        'CHECK OUT THE HUB <i>!PROCESSHUB</i>'
      ];
  msgs = msgs.filter(function(m){return m.trim()!==''});

  var sepChar = q.get('sep') || '\u25c6';

  function seq(){
    var d = document.createElement('div'); d.className='seq';
    msgs.forEach(function(m){
      var it = document.createElement('div'); it.className='item'; it.innerHTML=m; d.appendChild(it);
      var sp = document.createElement('div'); sp.className='sep'; sp.textContent=sepChar; d.appendChild(sp);
    });
    return d;
  }

  var track = document.getElementById('track');
  var a = seq(); track.appendChild(a);
  track.appendChild(seq());          // duplicate -> seamless -50% loop

  // speed: px per second (default 70). duration = width of ONE sequence / speed
  var pps = parseFloat(q.get('speed')||'55');
  requestAnimationFrame(function(){
    var w = a.getBoundingClientRect().width || 1200;
    track.style.setProperty('--dur', Math.max(8, w / pps) + 's');
    document.getElementById('bar').classList.add('in');
  });
})();
</script>
</body>
</html>
